name: Test Install Scripts

on:
  push:
    branches: [ main, feature/* ]
    paths: [ 'install.sh', 'distro-specific-install.sh', '.github/workflows/test-installers.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'install.sh', 'distro-specific-install.sh', '.github/workflows/test-installers.yml' ]

jobs:
  test-original-installer:
    name: Test Original Installer (Debian/Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:20.04
          - debian:12
    
    container:
      image: ${{ matrix.image }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run original installer
      run: |
        chmod +x ./install.sh
        ./install.sh
        echo 'Testing package installation...'
        dpkg -l | grep -E '(apache2|php|git|rsync)' || echo 'Package check completed'
        echo 'Testing service status...'
        systemctl status apache2 || echo 'Service check completed'
        echo 'Testing file permissions...'
        ls -la /var/www/html/ || echo 'Permission check completed'

  test-distro-specific-installer:
    name: Test Distro-Specific Installer
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - ubuntu:22.04
          - archlinux:latest
          - fedora:latest
          - opensuse/leap:latest
    
    container:
      image: ${{ matrix.image }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run distro-specific installer
      run: |
        chmod +x ./distro-specific-install.sh
        ./distro-specific-install.sh
        echo 'Testing package installation...'
        case '${{ matrix.image }}' in
          'ubuntu:22.04')
            dpkg -l | grep -E '(apache2|php|git|rsync)' || echo 'Package check completed'
            systemctl status apache2 || echo 'Service check completed'
            ;;
          'archlinux:latest')
            pacman -Q | grep -E '(apache|php|git|rsync)' || echo 'Package check completed'
            systemctl status httpd || echo 'Service check completed'
            ;;
          'fedora:latest')
            dnf list installed | grep -E '(httpd|php|git|rsync)' || echo 'Package check completed'
            systemctl status httpd || echo 'Service check completed'
            ;;
          'opensuse/leap:latest')
            zypper packages --installed | grep -E '(apache2|php|git|rsync)' || echo 'Package check completed'
            systemctl status apache2 || echo 'Service check completed'
            ;;
        esac
        echo 'Testing file permissions...'
        ls -la /var/www/html/ || echo 'Permission check completed'

  test-detection-only:
    name: Test OS Detection
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - ubuntu:22.04
          - archlinux:latest
          - fedora:latest
          - opensuse/leap:latest
          - centos:latest
    
    container:
      image: ${{ matrix.image }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Test detection
      run: |
        chmod +x ./distro-specific-install.sh
        echo 'Testing OS detection...'
        # Extract detection output without installing
        ./distro-specific-install.sh 2>&1 | head -20 || echo 'Detection test completed'

  test-edge-cases:
    name: Test Edge Cases
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - ubuntu:22.04
          - archlinux:latest
          - fedora:latest
          - opensuse/leap:latest
    
    container:
      image: ${{ matrix.image }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Test OS detection and package availability
      run: |
        echo "Testing OS detection and package availability on ${{ matrix.image }}..."
        chmod +x ./distro-specific-install.sh
        
        # Test OS detection
        echo "=== OS Detection Test ==="
        case '${{ matrix.image }}' in
          'ubuntu:22.04')
            echo "Expected: Linux with apt"
            uname -s
            command -v apt-get && echo "✓ apt-get found" || echo "✗ apt-get not found"
            command -v dpkg && echo "✓ dpkg found" || echo "✗ dpkg not found"
            ;;
          'archlinux:latest')
            echo "Expected: Linux with pacman"
            uname -s
            command -v pacman && echo "✓ pacman found" || echo "✗ pacman not found"
            ;;
          'fedora:latest')
            echo "Expected: Linux with dnf"
            uname -s
            command -v dnf && echo "✓ dnf found" || echo "✗ dnf not found"
            ;;
          'opensuse/leap:latest')
            echo "Expected: Linux with zypper"
            uname -s
            command -v zypper && echo "✓ zypper found" || echo "✗ zypper not found"
            ;;
        esac
        
        # Test package availability
        echo "=== Package Availability Test ==="
        case '${{ matrix.image }}' in
          'ubuntu:22.04')
            echo "Checking Ubuntu packages..."
            apt update || echo "apt update failed (expected in container)"
            apt list apache2 php php-gd git rsync 2>/dev/null | grep -E "(apache2|php|git|rsync)" || echo "Some packages not found in apt"
            ;;
          'archlinux:latest')
            echo "Checking Arch packages..."
            pacman -Ss apache php git rsync 2>/dev/null | head -5 || echo "Some packages not found in pacman"
            ;;
          'fedora:latest')
            echo "Checking Fedora packages..."
            dnf search httpd php git rsync 2>/dev/null | head -5 || echo "Some packages not found in dnf"
            ;;
          'opensuse/leap:latest')
            echo "Checking openSUSE packages..."
            zypper search apache2 php git rsync 2>/dev/null | head -5 || echo "Some packages not found in zypper"
            ;;
        esac
        
        # Test script detection logic (without running full installation)
        echo "=== Script Detection Logic Test ==="
        # Extract the detection logic and test it
        grep -A 20 "detect_os()" ./distro-specific-install.sh || echo "detect_os function not found"
        grep -A 30 "determine_package_manager()" ./distro-specific-install.sh || echo "determine_package_manager function not found"
        
        echo "Test completed for ${{ matrix.image }}"

  test-comparison:
    name: Compare Installers on Ubuntu
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Test original installer
      run: |
        chmod +x ./install.sh
        ./install.sh
        echo 'Original installer packages:'
        dpkg -l | grep -E '(apache2|php|git|rsync)' > /tmp/original-packages.txt
        cat /tmp/original-packages.txt
        
    - name: Test distro-specific installer
      run: |
        chmod +x ./distro-specific-install.sh
        ./distro-specific-install.sh
        echo 'Distro-specific installer packages:'
        dpkg -l | grep -E '(apache2|php|git|rsync)' > /tmp/new-packages.txt
        cat /tmp/new-packages.txt
        
    - name: Compare results
      run: |
        echo "Comparing installer outputs..."
        # This would compare the package lists to ensure they're identical
        echo "Both installers should produce identical results on Ubuntu"

  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install shellcheck
      run: |
        sudo apt update
        sudo apt install -y shellcheck
        
    - name: Lint install.sh
      run: shellcheck install.sh
      
    - name: Lint distro-specific-install.sh
      run: shellcheck distro-specific-install.sh 